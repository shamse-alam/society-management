# ===== Production Profile (Railway) =====
# Activate with: --spring.profiles.active=prod

# ---- PostgreSQL Database ----
# Railway provides: PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD
# We construct the JDBC URL from these individual variables
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Connection pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# Disable H2 console in production
spring.h2.console.enabled=false

# ---- Server ----
server.port=${PORT:8080}

# ---- JWT ----
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# ---- CORS ----
# Single-service deployment: frontend and backend on same origin, * is fine
app.cors.allowed-origins=${CORS_ORIGINS:*}

# ---- Frontend URL (for password reset emails, links) ----
# Set FRONTEND_URL env var in Railway to https://your-app.up.railway.app
app.frontend.url=${FRONTEND_URL:https://society-management-frontend-production.up.railway.app}

# ---- Mail ----
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---- File Upload ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=${UPLOAD_DIR:./uploads}

# ---- Serve frontend static files ----
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=31536000
