<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="50%" style="stop-color:#0d3b66"/>
      <stop offset="100%" style="stop-color:#1a6dd1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f6d365"/>
      <stop offset="100%" style="stop-color:#d4a73a"/>
    </linearGradient>
    <linearGradient id="roof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f6d365"/>
      <stop offset="100%" style="stop-color:#c9952a"/>
    </linearGradient>
  </defs>

  <!-- Main building - center tower -->
  <rect x="220" y="140" width="72" height="160" rx="2" fill="#0a1628" opacity="0.95"/>
  <polygon points="215,142 256,95 297,142" fill="url(#roof)"/>
  <circle cx="256" cy="93" r="7" fill="url(#gold)"/>
  <line x1="256" y1="86" x2="256" y2="74" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>

  <!-- Center tower windows -->
  <rect x="234" y="160" width="16" height="24" rx="8" fill="url(#bg)" opacity="0.8"/>
  <rect x="262" y="160" width="16" height="24" rx="8" fill="url(#bg)" opacity="0.8"/>
  <rect x="234" y="200" width="16" height="24" rx="8" fill="url(#bg)" opacity="0.8"/>
  <rect x="262" y="200" width="16" height="24" rx="8" fill="url(#bg)" opacity="0.8"/>

  <!-- Center door -->
  <rect x="241" y="252" width="30" height="48" rx="15" fill="url(#bg)" opacity="0.9"/>
  <circle cx="265" cy="278" r="2.5" fill="url(#gold)"/>

  <!-- Left wing -->
  <rect x="118" y="190" width="105" height="110" rx="2" fill="#0a1628" opacity="0.9"/>
  <polygon points="113,192 170,148 228,192" fill="url(#roof)" opacity="0.9"/>
  <rect x="132" y="210" width="14" height="22" rx="7" fill="url(#bg)" opacity="0.7"/>
  <rect x="158" y="210" width="14" height="22" rx="7" fill="url(#bg)" opacity="0.7"/>
  <rect x="184" y="210" width="14" height="22" rx="7" fill="url(#bg)" opacity="0.7"/>
  <rect x="132" y="248" width="14" height="22" rx="7" fill="url(#bg)" opacity="0.7"/>
  <rect x="158" y="248" width="14" height="22" rx="7" fill="url(#bg)" opacity="0.7"/>
  <rect x="184" y="248" width="14" height="22" rx="7" fill="url(#bg)" opacity="0.7"/>

  <!-- Right wing -->
  <rect x="289" y="190" width="105" height="110" rx="2" fill="#0a1628" opacity="0.9"/>
  <polygon points="284,192 341,148 399,192" fill="url(#roof)" opacity="0.9"/>
  <rect x="304" y="210" width="14" height="22" rx="7" fill="url(#bg)" opacity="0.7"/>
  <rect x="330" y="210" width="14" height="22" rx="7" fill="url(#bg)" opacity="0.7"/>
  <rect x="356" y="210" width="14" height="22" rx="7" fill="url(#bg)" opacity="0.7"/>
  <rect x="304" y="248" width="14" height="22" rx="7" fill="url(#bg)" opacity="0.7"/>
  <rect x="330" y="248" width="14" height="22" rx="7" fill="url(#bg)" opacity="0.7"/>
  <rect x="356" y="248" width="14" height="22" rx="7" fill="url(#bg)" opacity="0.7"/>

  <!-- Far left column -->
  <rect x="85" y="218" width="38" height="82" rx="2" fill="#0a1628" opacity="0.8"/>
  <polygon points="82,220 104,198 126,220" fill="url(#roof)" opacity="0.8"/>
  <rect x="94" y="234" width="10" height="16" rx="5" fill="url(#bg)" opacity="0.6"/>
  <rect x="94" y="260" width="10" height="16" rx="5" fill="url(#bg)" opacity="0.6"/>

  <!-- Far right column -->
  <rect x="389" y="218" width="38" height="82" rx="2" fill="#0a1628" opacity="0.8"/>
  <polygon points="386,220 408,198 430,220" fill="url(#roof)" opacity="0.8"/>
  <rect x="399" y="234" width="10" height="16" rx="5" fill="url(#bg)" opacity="0.6"/>
  <rect x="399" y="260" width="10" height="16" rx="5" fill="url(#bg)" opacity="0.6"/>

  <!-- Base -->
  <rect x="72" y="298" width="368" height="7" rx="3.5" fill="url(#gold)" opacity="0.85"/>

  <!-- Courtyard arches -->
  <path d="M118,300 L118,286 Q168,268 220,286 L220,300" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.5"/>
  <path d="M292,300 L292,286 Q342,268 394,286 L394,300" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.5"/>

  <!-- Text -->
  <text x="256" y="355" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="bold" fill="#0a1628" letter-spacing="4">THE</text>
  <text x="256" y="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="bold" fill="url(#gold)" letter-spacing="6">COURTYARD</text>
  <line x1="150" y1="414" x2="362" y2="414" stroke="url(#gold)" stroke-width="1.2" opacity="0.5"/>
  <text x="256" y="440" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#0d3b66" opacity="0.7" letter-spacing="5">SOCIETY MANAGEMENT</text>
</svg>