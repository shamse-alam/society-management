<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="50%" style="stop-color:#0d3b66"/>
      <stop offset="100%" style="stop-color:#1a6dd1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f6d365"/>
      <stop offset="100%" style="stop-color:#d4a73a"/>
    </linearGradient>
    <linearGradient id="roof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f6d365"/>
      <stop offset="100%" style="stop-color:#c9952a"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="250" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="235" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.3"/>

  <!-- Main building - center tower -->
  <rect x="220" y="180" width="72" height="140" rx="2" fill="#ffffff" opacity="0.95"/>
  <!-- Center tower roof -->
  <polygon points="215,182 256,140 297,182" fill="url(#roof)"/>
  <!-- Center tower peak ornament -->
  <circle cx="256" cy="138" r="6" fill="url(#gold)"/>
  <line x1="256" y1="132" x2="256" y2="122" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Center tower windows -->
  <rect x="234" y="198" width="16" height="22" rx="8" fill="#0d3b66" opacity="0.7"/>
  <rect x="262" y="198" width="16" height="22" rx="8" fill="#0d3b66" opacity="0.7"/>
  <rect x="234" y="235" width="16" height="22" rx="8" fill="#0d3b66" opacity="0.7"/>
  <rect x="262" y="235" width="16" height="22" rx="8" fill="#0d3b66" opacity="0.7"/>

  <!-- Center door -->
  <rect x="241" y="280" width="30" height="40" rx="15" fill="#0d3b66" opacity="0.8"/>
  <circle cx="265" cy="302" r="2" fill="url(#gold)"/>

  <!-- Left wing -->
  <rect x="138" y="220" width="85" height="100" rx="2" fill="#ffffff" opacity="0.9"/>
  <!-- Left wing roof -->
  <polygon points="133,222 180,185 228,222" fill="url(#roof)" opacity="0.9"/>
  <!-- Left wing windows -->
  <rect x="150" y="238" width="14" height="20" rx="7" fill="#0d3b66" opacity="0.6"/>
  <rect x="174" y="238" width="14" height="20" rx="7" fill="#0d3b66" opacity="0.6"/>
  <rect x="198" y="238" width="14" height="20" rx="7" fill="#0d3b66" opacity="0.6"/>
  <rect x="150" y="272" width="14" height="20" rx="7" fill="#0d3b66" opacity="0.6"/>
  <rect x="174" y="272" width="14" height="20" rx="7" fill="#0d3b66" opacity="0.6"/>
  <rect x="198" y="272" width="14" height="20" rx="7" fill="#0d3b66" opacity="0.6"/>

  <!-- Right wing -->
  <rect x="289" y="220" width="85" height="100" rx="2" fill="#ffffff" opacity="0.9"/>
  <!-- Right wing roof -->
  <polygon points="284,222 332,185 379,222" fill="url(#roof)" opacity="0.9"/>
  <!-- Right wing windows -->
  <rect x="300" y="238" width="14" height="20" rx="7" fill="#0d3b66" opacity="0.6"/>
  <rect x="324" y="238" width="14" height="20" rx="7" fill="#0d3b66" opacity="0.6"/>
  <rect x="348" y="238" width="14" height="20" rx="7" fill="#0d3b66" opacity="0.6"/>
  <rect x="300" y="272" width="14" height="20" rx="7" fill="#0d3b66" opacity="0.6"/>
  <rect x="324" y="272" width="14" height="20" rx="7" fill="#0d3b66" opacity="0.6"/>
  <rect x="348" y="272" width="14" height="20" rx="7" fill="#0d3b66" opacity="0.6"/>

  <!-- Far left column -->
  <rect x="108" y="245" width="34" height="75" rx="2" fill="#ffffff" opacity="0.8"/>
  <polygon points="105,247 125,228 145,247" fill="url(#roof)" opacity="0.8"/>
  <rect x="115" y="260" width="10" height="14" rx="5" fill="#0d3b66" opacity="0.5"/>
  <rect x="115" y="284" width="10" height="14" rx="5" fill="#0d3b66" opacity="0.5"/>

  <!-- Far right column -->
  <rect x="370" y="245" width="34" height="75" rx="2" fill="#ffffff" opacity="0.8"/>
  <polygon points="367,247 387,228 407,247" fill="url(#roof)" opacity="0.8"/>
  <rect x="378" y="260" width="10" height="14" rx="5" fill="#0d3b66" opacity="0.5"/>
  <rect x="378" y="284" width="10" height="14" rx="5" fill="#0d3b66" opacity="0.5"/>

  <!-- Base/ground -->
  <rect x="95" y="318" width="322" height="6" rx="3" fill="url(#gold)" opacity="0.8"/>

  <!-- Courtyard arch/fence between wings -->
  <path d="M138,320 L138,306 Q180,290 220,306 L220,320" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.5"/>
  <path d="M292,320 L292,306 Q332,290 374,306 L374,320" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.5"/>

  <!-- Trees -->
  <circle cx="120" cy="300" r="10" fill="#4ade80" opacity="0.3"/>
  <circle cx="392" cy="300" r="10" fill="#4ade80" opacity="0.3"/>

  <!-- Text: THE COURTYARD -->
  <text x="256" y="365" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="bold" fill="#ffffff" letter-spacing="4">THE</text>
  <text x="256" y="405" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="bold" fill="url(#gold)" letter-spacing="6">COURTYARD</text>

  <!-- Decorative line under text -->
  <line x1="165" y1="418" x2="347" y2="418" stroke="url(#gold)" stroke-width="1" opacity="0.5"/>

  <!-- Tagline -->
  <text x="256" y="440" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#ffffff" opacity="0.6" letter-spacing="5">SOCIETY MANAGEMENT</text>
</svg>